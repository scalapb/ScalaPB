queue_rules:
  - name: default
    queue_conditions:
      - check-success=ci-passed
    merge_conditions:
      - check-success=ci-passed

pull_request_rules:
  - name: assign and label dependency PRs
    conditions:
      - or:
          - author=scala-steward
          - author=dependabot[bot]
    actions:
      assign:
        users: [thesamet]
      label:
        add: [dependency-update]
  - name: merge dependency PRs
    conditions:
      - or:
          - author=scala-steward
          - author=dependabot[bot]
      - check-success=ci-passed
    actions:
      queue:
