syntax = "proto2";
package com.thesamet.proto.e2e;
import "google/protobuf/any.proto";

message GroupContainer {
  optional group OptionalGroup = 1 {
    optional int32 value = 2;
    optional group NestedGroup = 3 {
      optional string text = 4;
    }
  }
  repeated group RepeatedGroup = 5 {
    optional int32 value = 6;
  }
  required group RequiredGroup = 7 {
    optional int32 value = 8;
  }
  optional int32 tail = 9;
  extensions 100 to max;
}

extend GroupContainer {
  optional group ExtensionGroup = 100 {
    optional int32 first = 101;
    optional int32 second = 102;
  }
  optional GroupEnvelope envelope_extension = 106;
  repeated group RepeatedExtensionGroup = 103 {
    optional int32 value = 104;
  }
}

message GroupUnknown {}

message GroupEnvelope {
  optional GroupContainer value = 1;
  repeated GroupContainer values = 2;
  map<string, GroupContainer> entries = 3;
  oneof choice {
    GroupContainer selected = 4;
    int32 number = 5;
  }
  optional google.protobuf.Any wrapped = 6;
  optional double double_value = 10;
  optional float float_value = 11;
  optional int64 int64_value = 12;
  optional uint64 uint64_value = 13;
  optional int32 int32_value = 14;
  optional fixed64 fixed64_value = 15;
  optional fixed32 fixed32_value = 16;
  optional bool bool_value = 17;
  optional string string_value = 18;
  optional bytes bytes_value = 19;
  optional uint32 uint32_value = 20;
  optional sfixed32 sfixed32_value = 21;
  optional sfixed64 sfixed64_value = 22;
  optional sint32 sint32_value = 23;
  optional sint64 sint64_value = 24;
  enum Kind { ZERO = 0; ONE = 1; }
  optional Kind kind = 25;
  repeated int32 packed_values = 26 [packed = true];
}
