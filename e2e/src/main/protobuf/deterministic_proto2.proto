syntax = "proto2";
package scalapb.deterministic;
import "scalapb/scalapb.proto";
option (scalapb.options).deterministic_serialization = true;
option (scalapb.options).getters = false;
message Proto2Message {
  map<string, int32> custom_keys = 1 [(scalapb.field).key_type = "com.thesamet.pb.PersonId"];
}
