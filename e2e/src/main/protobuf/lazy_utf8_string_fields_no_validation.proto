edition = "2023";

import "scalapb/scalapb.proto";

package com.thesamet.proto.e2e;

option (scalapb.options) = {
  use_schema_utf8_validation: true
  lazy_utf8_string_fields: true
};

// Lazy string fields follow the schema UTF-8 policy on parse.
message LazyNoUtf8Validation {
  string unchecked = 1 [features.utf8_validation = NONE];
  string checked = 2;
}
