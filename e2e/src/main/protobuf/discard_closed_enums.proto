syntax = "proto2";
option (scalapb.options).use_schema_enum_semantics = true;
package closed.discard;
import "scalapb/scalapb.proto";
import "closed_enums.proto";
option (scalapb.options).preserve_unknown_fields = false;
message DiscardClosedEnums {
  optional closed.enums.ClosedEnums.Value singular = 1;
  repeated closed.enums.ClosedEnums.Value packed = 2 [packed = true];
  oneof choice { closed.enums.ClosedEnums.Value selected = 3; }
  map<int32, closed.enums.ClosedEnums.Value> entries = 4;
}
