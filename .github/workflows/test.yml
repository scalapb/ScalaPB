name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCALA_VERSION: ${{matrix.scala}}
    strategy:
      fail-fast: false
      matrix:
        scala: [2_12, 2_13, 3]
        script: [e2e, test]
        include:
        - scala: 2_12
          script: examples_and_formatting
        - scala: 3
          script: scala3_compat_test

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin

    - name: Configure Maven Central
      run: |
        printf "[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n" > "$RUNNER_TEMP/sbt-repositories"
        {
          echo "SBT_OPTS=-Dsbt.repository.config=$RUNNER_TEMP/sbt-repositories"
          echo "COURSIER_REPOSITORIES=https://repo.maven.apache.org/maven2"
          echo "SBT_LAUNCH_REPO=https://repo.maven.apache.org/maven2"
        } >> "$GITHUB_ENV"

    - uses: sbt/setup-sbt@v1

    - name: Mount caches
      uses: actions/cache@v6
      with:
        path: |
          ~/.sbt
          ~/.cache/sbt
          ~/.ivy2/cache
          ~/.cache/coursier
        key: ${{ runner.os }}-sbt-${{matrix.scala}}-${{matrix.script}}-${{ hashFiles('**/*.sbt', '**/build.properties', 'project/**/*.scala') }}

    # Bootstrap in the foreground so cold downloads do not hit sbtn's 300s timeout.
    - name: Bootstrap sbt
      run: sbt --server --batch reload

    - uses: actions/setup-node@v7
      if: matrix.script == 'examples_and_formatting'
      with:
        node-version: "22"

    - name: ${{matrix.script}}
      run: |
        ./${{matrix.script}}.sh
      env:
        JAVA_OPTS: -Xmx4G -XX:+UseG1GC
        JVM_OPTS:  -Xmx4G -XX:+UseG1GC

    - name: Build website
      if: matrix.script == 'examples_and_formatting'
      working-directory: website
      run: |
        corepack enable
        yarn install --frozen-lockfile
        yarn build

  conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/cache@v6
      id: conformance-cache
      with:
          key: conformance-${{ runner.os }}-${{hashFiles('conformance/build_test_runner.sh')}}
          path: /tmp/conformance-test-runner
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - name: Configure Maven Central
      run: |
        printf "[repositories]\nlocal\nmaven-central: https://repo.maven.apache.org/maven2\n" > "$RUNNER_TEMP/sbt-repositories"
        {
          echo "SBT_OPTS=-Dsbt.repository.config=$RUNNER_TEMP/sbt-repositories"
          echo "COURSIER_REPOSITORIES=https://repo.maven.apache.org/maven2"
          echo "SBT_LAUNCH_REPO=https://repo.maven.apache.org/maven2"
        } >> "$GITHUB_ENV"

    - uses: sbt/setup-sbt@v1

    # Build conformance_test_runner on a cache miss
    - uses: bazelbuild/setup-bazelisk@v3
      if: steps.conformance-cache.outputs.cache-hit != 'true'
    - uses: actions/cache@v6
      if: steps.conformance-cache.outputs.cache-hit != 'true'
      with:
        path: |
          ~/.cache/bazel
        key: bazel
    - run: conformance/build_test_runner.sh
      if: steps.conformance-cache.outputs.cache-hit != 'true'

    - uses: actions/cache@v6
      with:
        path: |
          ~/.sbt
          ~/.cache/sbt
          ~/.ivy2/cache
          ~/.cache/coursier
        key: ${{ runner.os }}-sbt-conformance-${{ hashFiles('**/*.sbt', '**/build.properties', 'project/**/*.scala') }}
    - run: |
        sbt --server --batch conformanceJVM2_13/assembly
        /tmp/conformance-test-runner/conformance_test_runner --enforce_recommended \
          --failure_list conformance/failure_list_scalapb.txt \
          --text_format_failure_list conformance/text_format_failure_list_scalapb.txt \
          target/out/jvm/scala-*/conformance/conformance
      shell: bash

  # Single final job for mergify.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [build, conformance]
    if: always()
    steps:
    - name: Require all CI jobs to pass
      env:
        BUILD_RESULT: ${{ needs.build.result }}
        CONFORMANCE_RESULT: ${{ needs.conformance.result }}
      run: test "$BUILD_RESULT" = success && test "$CONFORMANCE_RESULT" = success
